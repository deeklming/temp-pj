[project]
name = "temppj-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi", "uvicorn[standard]", "sqlmodel", "alembic", "argon2-cffi", "redis", "python-dotenv"]

[dependency-groups]
dev = ["pytest", "httpx", "websockets", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/temppj_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
